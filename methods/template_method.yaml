# Low-level YAML template.
# For the step-by-step user guide to add an external algorithm, see:
#   docs/algorithm_extension_guide.md
# Copy this file only if you already know the YAML contract.
#
# Rules for author methods:
# - keep the algorithm core in vendor/<method>/ or external/original_code/<method>/;
# - use runner.command to call the author script with SCRBenchmark placeholders;
# - expose preprocessing and hyperparameters through placeholders and {param_args}
#   instead of hardcoding them in the integration;
# - add a small adapter only if the author script cannot read the exported input
#   or cannot write labels/embeddings to reusable files;
# - declare every intentional modification as a separate experimental method.
#
# Runner choices:
# - command_template: recommended for new external methods.
#   SCRBenchmark fills {data}, {output}, {n_labels}, {seed}, {device}, etc.
# - scrbenchmark_cli: method already callable by the SCRBenchmark CLI, while this
#   YAML remains the benchmark/reproduction entry point.
# - legacy runners such as external_method or passthrough_script remain
#   available for old methods; new integrations should prefer command_template.

name: my_method
display_name: My Method
family: deep_learning
report: true
core_contract: author_core_unchanged
core_status: original_source_pending_validation
aliases: []
source:
  kind: original_source
  path: vendor/my_method
  reference: "paper/repository DOI or URL"
runner:
  kind: command_template
  command:
    - "{python_bin}"
    - "{source_path}/main.py"
    - "--input"
    - "{data}"
    - "--output"
    - "{raw_dir}"
    - "--clusters"
    - "{n_labels}"
    - "--seed"
    - "{seed}"
    - "--n-top-genes"
    - "{n_top_genes}"
    - "--target-sum"
    - "{target_sum}"
    - "{param_args}"
output:
  expected_file: results/analysis_results.csv
  labels_file: raw/labels.csv
  labels_column: cluster
  cell_id_column: cell_id
  # Optional, if the method writes embeddings:
  # latent_file: raw/latent.csv
notes: "Adapt runner.command and output.* to the author code."
