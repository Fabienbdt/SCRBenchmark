name: Tests and installed package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/scrbenchmark-ci/matplotlib
      XDG_CACHE_HOME: /tmp/scrbenchmark-ci/cache
      NUMBA_CACHE_DIR: /tmp/scrbenchmark-ci/numba
      NUMBA_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      SCRB_DISABLE_SCIB_METRICS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            constraints/python312-tested.txt
      - name: Install CPU PyTorch on Linux
        if: runner.os == 'Linux'
        run: |
          sed '/^torch==/d' constraints/python312-tested.txt > "$RUNNER_TEMP/python312-linux.txt"
          python -m pip install 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Install development environment
        if: runner.os == 'macOS'
        run: python -m pip install -c constraints/python312-tested.txt -e '.[dev,gui]'
      - name: Install development environment on Linux
        if: runner.os == 'Linux'
        run: python -m pip install -c "$RUNNER_TEMP/python312-linux.txt" -e '.[dev,gui]'
      - name: Check dependencies and source compilation
        run: |
          python -m pip check
          python -m compileall -q src scripts vendor/scraw_inductive/src vendor/scraw_dedicated/src
      - name: Test source checkout, including synthetic workflows
        run: python -m pytest -q
      - name: Build source archive and wheel from that archive
        run: python -m build
      - name: Install wheel and copy standalone tests outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          mkdir -p "$RUNNER_TEMP/installed-tests"
          cp tests/integration/*.py "$RUNNER_TEMP/installed-tests/"
          cp tests/unit_tests/test_package_metadata.py "$RUNNER_TEMP/installed-tests/"
      - name: Test the installed wheel without source imports
        working-directory: ${{ runner.temp }}/installed-tests
        run: python -I -m pytest -q --strict-markers --strict-config
      - name: Preserve distributable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: dist/*
