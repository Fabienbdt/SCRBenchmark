[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SCRBenchmark"
version = "1.1.0"
description = "Benchmark suite for single-cell RNA-seq clustering algorithms"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
scrbenchmark = "scrbenchmark.cli:main"
scrbenchmark-gui = "scrbenchmark.launcher:main"

[project.urls]
Repository = "https://github.com/Fabienbdt/SCRBenchmark"
Issues = "https://github.com/Fabienbdt/SCRBenchmark/issues"

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "pytest>=7.0",
]
gui = ["streamlit>=1.32", "watchdog>=3.0"]
reproduction = [
    "harmonypy>=0.0.10", "scanorama>=1.7.4", "scib-metrics==0.5.1",
    "scvi-tools>=1.3.0", "hnswlib>=0.8.0",
]
llm = [
    "cell2sentence>=1.1.0", "transformers>=4.40.0", "datasets>=2.19.0",
    "accelerate>=0.29.0", "tiktoken", "sentencepiece",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.cmdclass]
build_py = "scrbenchmark._build.BuildPy"

[tool.setuptools.packages.find]
where = ["src"]
include = ["scrbenchmark*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
